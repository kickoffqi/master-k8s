namespace: master-k8s
images:
  api:
    repository: ghcr.io/kickoffqi/master-k8s-api
    tag: sha-3c5502c
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/kickoffqi/master-k8s-frontend
    tag: sha-cf863b9
    pullPolicy: IfNotPresent
replicaCount:
  api: 1
  frontend: 2
ingress:
  enabled: true
  className: nginx
  host: dev.master.local
api:
  corsAllowOrigins: '*'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  publicApiBaseUrl: /api
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
rollouts:
  enabled: true
  canarySteps:
  - setWeight: 20
  - pause:
      duration: 30s
  - setWeight: 50
  - pause:
      duration: 30s
  - setWeight: 100
